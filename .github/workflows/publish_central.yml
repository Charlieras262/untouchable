# Publishes untouchable-parent, untouchable-core and untouchable-pdf to Maven Central
# (https://central.sonatype.com) when a GitHub release with a vX.Y.Z tag is published.
#
# The deployment is uploaded and validated, but NOT published automatically (autoPublish=false in pom.xml):
# review it in the Central Portal and click "Publish". A published version can never be removed.
#
# Required repository secrets (see RELEASING.md):
#   CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD  Central Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE                 key that signs the artifacts

name: Publish to Maven Central

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-central
  cancel-in-progress: false

jobs:
  test:
    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11', '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: ./mvnw -B verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          VERSION="${INPUT:-${TAG#v}}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "Invalid release version: '$VERSION' (use a vX.Y.Z tag)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set the version
        run: ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build, sign and upload
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease -DskipTests deploy
